<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1000" height="360" fill="#0d1117"/>

  <g>
    <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,14;0,0" keyTimes="0;1"
      calcMode="spline" keySplines="0.22,1,0.36,1" dur="0.8s" begin="0s" fill="freeze"/>

    <text x="24" y="34" fill="#8b949e" font-size="13">&gt; research notebook --live</text>
    <rect x="214" y="21" width="8" height="15" fill="#3fb950">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <line x1="690" y1="70" x2="980" y2="70" stroke="#21262d" stroke-width="2"/>
    <g stroke="#30363d" stroke-width="1">
      <rect x="700" y="30" width="14" height="40" fill="#30363d"/>
      <rect x="716" y="22" width="12" height="48" fill="#3fb950" opacity="0.5"/>
      <rect x="730" y="35" width="16" height="35" fill="#21262d"/>
      <rect x="748" y="18" width="13" height="52" fill="#58a6ff" opacity="0.5"/>
      <rect x="763" y="28" width="15" height="42" fill="#21262d"/>
      <rect x="780" y="24" width="12" height="46" fill="#bc8cff" opacity="0.5"/>
      <rect x="794" y="32" width="14" height="38" fill="#30363d"/>
      <rect x="810" y="20" width="13" height="50" fill="#f0883e" opacity="0.5"/>
      <rect x="825" y="30" width="16" height="40" fill="#21262d"/>
      <rect x="843" y="25" width="12" height="45" fill="#f778ba" opacity="0.45"/>
      <rect x="857" y="33" width="14" height="37" fill="#30363d"/>
    </g>

    <line x1="0" y1="290" x2="1000" y2="290" stroke="#21262d" stroke-width="2"/>
    <rect x="0" y="290" width="1000" height="6" fill="#161b22"/>

    <polygon points="80,290 320,290 300,262 100,262" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect x="120" y="118" width="160" height="144" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect x="126" y="124" width="148" height="118" fill="#010409"/>

    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.333;0.334;1" dur="12s" begin="1s" repeatCount="indefinite"/>
      <g fill="none" stroke="#21262d" stroke-width="2">
        <path d="M134,228 L158,208 L148,178 L188,170 L204,142 L244,150 L268,134"/>
        <path d="M148,178 L128,196"/>
        <path d="M204,142 L234,126"/>
        <path d="M188,170 L222,192"/>
      </g>
      <circle cx="148" cy="178" r="3" fill="#30363d"/>
      <circle cx="204" cy="142" r="3" fill="#30363d"/>
      <circle cx="188" cy="170" r="3" fill="#30363d"/>
      <circle r="2.5" fill="#58a6ff">
        <animateMotion dur="8s" repeatCount="indefinite"
          path="M134,228 L158,208 L148,178 L188,170 L204,142 L244,150 L268,134 L244,150 L204,142 L188,170 L148,178 L158,208 L134,228"/>
      </circle>
      <circle r="2.5" fill="#f0883e">
        <animateMotion dur="9.5s" begin="-3s" repeatCount="indefinite"
          path="M134,228 L158,208 L148,178 L188,170 L204,142 L244,150 L268,134 L244,150 L204,142 L188,170 L148,178 L158,208 L134,228"/>
      </circle>
      <text x="200" y="238" fill="#8b949e" font-size="9" text-anchor="middle">vehicle trace, Dhaka roads</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.334;0.667;0.668;1" dur="12s" begin="1s" repeatCount="indefinite"/>
      <g stroke="#21262d" stroke-width="1">
        <line x1="136" y1="230" x2="264" y2="230"/>
        <line x1="136" y1="230" x2="136" y2="146"/>
      </g>
      <g>
        <rect x="140" y="190" width="16" height="40" fill="#58a6ff"/>
        <rect x="164" y="165" width="16" height="65" fill="#3fb950"/>
        <rect x="188" y="200" width="16" height="30" fill="#f0883e">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="2.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="212" y="175" width="16" height="55" fill="#bc8cff"/>
        <rect x="236" y="185" width="16" height="45" fill="#f778ba"/>
      </g>
      <text x="200" y="150" fill="#8b949e" font-size="9" text-anchor="middle">retrieval accuracy, by index</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.668;1" dur="12s" begin="1s" repeatCount="indefinite"/>
      <g fill="#8b949e" font-size="10">
        <text x="134" y="150">$ python eval.py --k 5</text>
        <text x="134" y="166" fill="#3fb950">37/40 grounded, 3 flagged</text>
        <text x="134" y="182">$ git commit -m "fix retriever"</text>
        <text x="134" y="198">1 file changed, 6 insertions</text>
      </g>
      <rect x="134" y="204" width="7" height="12" fill="#3fb950">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="200" y="304" fill="#8b949e" font-size="12" text-anchor="middle">laptop, mid-simulation</text>

    <line x1="450" y1="290" x2="450" y2="140" stroke="#30363d" stroke-width="4"/>
    <polygon points="420,140 480,140 465,95 435,95" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="450" cy="138" r="26" fill="#ffb454" opacity="0.12">
      <animate attributeName="opacity" values="0.10;0.22;0.10" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="138" r="14" fill="#ffb454" opacity="0.25">
      <animate attributeName="opacity" values="0.20;0.35;0.20" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="138" r="6" fill="#ffdca8">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="5s" repeatCount="indefinite"/>
    </circle>

    <g fill="#ffdca8">
      <circle cx="438" cy="150" r="1.3" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
        <animateMotion dur="6s" begin="1.5s" repeatCount="indefinite" path="M0,0 L-10,-38"/>
      </circle>
      <circle cx="462" cy="155" r="1.1" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="7s" begin="3.5s" repeatCount="indefinite"/>
        <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" path="M0,0 L8,-42"/>
      </circle>
      <circle cx="448" cy="160" r="1.2" opacity="0">
        <animate attributeName="opacity" values="0;0.45;0" dur="6.5s" begin="5.5s" repeatCount="indefinite"/>
        <animateMotion dur="6.5s" begin="5.5s" repeatCount="indefinite" path="M0,0 L-4,-46"/>
      </circle>
    </g>

    <g>
      <rect x="730" y="278" width="90" height="12" rx="1" fill="#21262d" stroke="#30363d" stroke-width="1" transform="rotate(-2 775 284)"/>
      <rect x="736" y="266" width="84" height="12" rx="1" fill="#30363d" stroke="#30363d" stroke-width="1" transform="rotate(1.5 778 272)"/>
      <rect x="740" y="254" width="78" height="12" rx="1" fill="#161b22" stroke="#30363d" stroke-width="1" transform="rotate(-1 779 260)"/>
    </g>

    <g transform="translate(695,22)" stroke="#8b949e" stroke-width="1.8">
      <path fill="none" stroke-linecap="round" d="M 96,216 C 112,220 122,208 116,196 C 112,189 102,190 100,197">
        <animate attributeName="d"
          values="M 96,216 C 112,220 122,208 116,196 C 112,189 102,190 100,197;
                   M 96,216 C 118,224 130,208 120,192 C 114,183 100,187 100,197;
                   M 96,216 C 112,220 122,208 116,196 C 112,189 102,190 100,197"
          keyTimes="0;0.88;1" dur="7s" begin="1s" repeatCount="indefinite"/>
      </path>

      <g fill="#161b22">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="4s" begin="1s" repeatCount="indefinite"/>
        <path d="M 40,224 C 39,206 54,190 74,190 C 93,190 99,204 96,218 C 93,229 74,234 56,232 C 46,231 40,228 40,224 Z"/>
        <ellipse cx="60" cy="227" rx="9" ry="5"/>
        <circle cx="47" cy="199" r="10"/>
        <polygon points="40,194 41,183 46,193"/>
        <polygon points="48,193 53,183 54,194"/>
        <polygon points="41,192 41.5,186 44,191" fill="#f778ba" opacity="0.5" stroke="none"/>
        <polygon points="50,191 52.5,186 53,192" fill="#f778ba" opacity="0.5" stroke="none"/>
        <path fill="none" stroke="#8b949e" stroke-width="1.5" d="M 40.5,200 Q 43.5,203.5 46.5,200"/>
        <path fill="none" stroke="#8b949e" stroke-width="1.5" d="M 47.5,200 Q 50.5,203.5 53.5,200"/>
        <polygon points="46,203 48,203 47,205" fill="#f778ba" opacity="0.7" stroke="none"/>
        <g stroke="#8b949e" stroke-width="0.9" opacity="0.7">
          <line x1="42" y1="203" x2="31" y2="201"/>
          <line x1="42" y1="205" x2="31" y2="207"/>
          <line x1="52" y1="203" x2="63" y2="201"/>
          <line x1="52" y1="205" x2="63" y2="207"/>
        </g>
      </g>
    </g>

    <text x="775" y="304" fill="#8b949e" font-size="12" text-anchor="middle">the reading pile</text>
  </g>
